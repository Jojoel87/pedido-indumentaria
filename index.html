<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido de Indumentaria Deportiva</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1611506815197-52f8639b3053?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.7);
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
    }
    h1 {
      text-align: center;
      color: #00ff7f;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: none;
    }
    button {
      background-color: #00ff7f;
      border: none;
      padding: 12px;
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .message {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      color: #00ff7f;
    }
    .player {
      margin-top: 20px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
    }
    .player input, .player select {
      width: calc(33.33% - 15px);
      margin-right: 10px;
      display: inline-block;
    }
    .remove-btn {
      background-color: red;
      border: none;
      color: white;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pedido de Indumentaria</h1>
    <form id="pedidoForm" action="https://script.google.com/macros/s/AKfycbxlhqt7PTsLWHLWUHzm2jcOura083n8nqnxNzw7947cavCEhwXgmoDl48BJ1ymok7-5/exec" method="POST">
      <label>Nombre del equipo</label>
      <input type="text" name="equipo" required>

      <div id="playersContainer">
        <div class="player">
          <label>Nombre del jugador</label>
          <input type="text" name="jugador[]" required>

          <label>Número del jugador</label>
          <input type="text" name="numero[]" required>

          <label>Seleccioná los artículos</label>
          <select name="articulo[]" multiple required>
            <option value="Camiseta">Camiseta</option>
            <option value="Short">Short</option>
            <option value="Medias">Medias</option>
            <option value="Buzo">Buzo</option>
            <option value="Otro">Otro</option>
          </select>

          <label>Talle</label>
          <select name="talle[]" required>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
            <option value="Otro">Otro</option>
          </select>

          <button type="button" class="remove-btn" onclick="removePlayer(this)">Eliminar jugador</button>
        </div>
      </div>

      <button type="button" onclick="addPlayer()">Agregar otro jugador</button>

      <label>Comentarios adicionales</label>
      <textarea name="comentarios"></textarea>

      <button type="submit">Enviar pedido</button>
    </form>

    <div class="message" id="mensajeConfirmacion">✅ Tu pedido fue enviado. ¡Gracias!</div>
  </div>

  <script>
    // Función para agregar un jugador dinámicamente
    function addPlayer() {
      const playersContainer = document.getElementById('playersContainer');
      const newPlayer = document.createElement('div');
      newPlayer.classList.add('player');
      newPlayer.innerHTML = `
        <label>Nombre del jugador</label>
        <input type="text" name="jugador[]" required>

        <label>Número del jugador</label>
        <input type="text" name="numero[]" required>

        <label>Seleccioná los artículos</label>
        <select name="articulo[]" multiple required>
          <option value="Camiseta">Camiseta</option>
          <option value="Short">Short</option>
          <option value="Medias">Medias</option>
          <option value="Buzo">Buzo</option>
          <option value="Otro">Otro</option>
        </select>

        <label>Talle</label>
        <select name="talle[]" required>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
          <option value="Otro">Otro</option>
        </select>

        <button type="button" class="remove-btn" onclick="removePlayer(this)">Eliminar jugador</button>
      `;
      playersContainer.appendChild(newPlayer);
    }

    // Función para eliminar un jugador
    function removePlayer(button) {
      button.parentElement.remove();
    }

    // Manejo del envío del formulario con AJAX
    document.getElementById('pedidoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = this;
      const mensaje = document.getElementById('mensajeConfirmacion');

      fetch(form.action, {
        method: form.method,
        body: new FormData(form),
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          form.reset();
          mensaje.style.display = 'block';
        } else {
          alert("Hubo un error al enviar el formulario, por favor intenta de nuevo.");
        }
      })
      .catch(error => {
        alert("Hubo un error al enviar el formulario, por favor intenta de nuevo.");
      });
    });
  </script>
</body>
</html>
