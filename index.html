<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedido de Indumentaria</title>
  <style>
    body {
      background-color: #e8f5e9;
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 20px;
      color: #333;
    }
    h1 {
      color: #2e7d32;
    }
    form {
      max-width: 600px;
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #43a047;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .success {
      color: green;
      margin-top: 15px;
    }
    .error {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>Formulario de Pedido</h1>
  <form id="pedidoForm">
    <label for="equipo">Nombre del Equipo</label>
    <input type="text" name="equipo" required>

    <label for="jugador">Nombre del Jugador</label>
    <input type="text" name="jugador" required>

    <label for="numero">Número</label>
    <input type="number" name="numero" required>

    <label for="articulo">Artículo</label>
    <select name="articulo" required>
      <option value="">Seleccionar</option>
      <option value="Camiseta">Camiseta</option>
      <option value="Short">Short</option>
      <option value="Ambos">Camiseta + Short</option>
    </select>

    <label for="talle">Talle</label>
    <input type="text" name="talle" required>

    <label for="comentarios">Comentarios</label>
    <textarea name="comentarios" rows="3"></textarea>

    <button type="submit">Enviar Pedido</button>
    <div id="mensaje"></div>
  </form>

  <script>
    const form = document.getElementById("pedidoForm");
    const mensaje = document.getElementById("mensaje");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(form);
      const data = new URLSearchParams(formData);

      fetch("https://script.google.com/macros/s/AKfycbxiNkzLO7EYR_cDayGEajcz_p90u9K4--0-gXExGOfAulq8VUtUQkA4J0WjqIUyqSQW/exec", {
        method: "POST",
        body: data
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          mensaje.innerHTML = "<p class='success'>✅ Pedido enviado correctamente.</p>";
          form.reset();
        } else {
          mensaje.innerHTML = "<p class='error'>❌ Error al enviar el pedido.</p>";
        }
      })
      .catch(err => {
        mensaje.innerHTML = "<p class='error'>❌ Error de conexión al enviar el pedido.</p>";
        console.error(err);
      });
    });
  </script>

</body>
</html>
